# Expected-matrix manifest declaring the required (runtime, config) columns
# and their baseline disabled suites and configured skips.
#
# Each column mirrors the conformance configuration checked in at the latest
# GitHub release tag of that runtime:
#   runtime_version: Release tag of the runtime.
#   spec_commit:     cel-spec revision rendered in the Spec Commit row. Counts
#                    are always computed against cel-spec HEAD testdata; the
#                    pinned cel-spec release is noted in parentheses.
#   disabled_suites: Testdata files present at the pin but not listed in the
#                    runtime's `_ALL_TESTS` (rendered as ⬜).
#   absent_suites:   Testdata files that do not exist at the pinned cel-spec
#                    (rendered as `n/a`).
#   absent_sections: "<suite>/<section>" keys that do not exist at the pinned
#                    cel-spec (rendered as `n/a`).
#   configured_skips: The runtime's skip list at the release tag. Entries that
#                    reference tests no longer present at cel-spec HEAD are
#                    omitted (and called out in comments) because they cannot
#                    affect the matrix.
#
# Sections and individual tests present in testdata .textproto files that have
# been removed or deprecated from the CEL specification and are excluded from
# the matrix across all columns:
excluded_sections:
  - enums/strong_proto2
  - enums/strong_proto3
excluded_tests:
  - basic/functions/unbound_is_runtime_error

columns:
  # https://github.com/cel-expr/cel-go/blob/v0.32.0/conformance/BUILD.bazel
  # cel-spec pinned via git_override to ba58ae5 (BCR 0.25.2) in MODULE.bazel.
  - id: go
    runtime: go
    config: default
    label: "Go"
    build_file: "third_party/cel/go/conformance/BUILD"
    build_skip_var: "_TESTS_TO_SKIP"
    build_tests_var: "_ALL_TESTS"
    # Skips present in the workspace's older cel-go import that were fixed
    # by v0.32.0:
    ignored_build_skips:
      - macros/exists/list_elem_type_exhaustive,map_key_type_exhaustive
      - macros/map/map_extract_keys
      - string_ext/format
    runtime_version: "v0.32.0"
    spec_commit: "HEAD (pinned: ba58ae5)"
    disabled_suites:
      - network_ext.textproto
      - block_ext.textproto
      - lists_ext.textproto
      - macros2.textproto
      - sets_ext.textproto
      - type_deduction.textproto
    configured_skips:
      - fields/qualified_identifier_resolution/map_key_float,map_key_null,map_value_repeat_key
      - fields/qualified_identifier_resolution/map_value_repeat_key_heterogeneous
      - timestamps/duration_converters/get_milliseconds
      - optionals/optionals/map_optional_select_has
      - optionals/optionals/map_optional_none_select
      - optionals/optionals/map_optional_of_select
      - optionals/optionals/map_optional_of_select_has
      - timestamps/duration_conversions/from_string_max
      - timestamps/duration_conversions/from_string_min
      - timestamps/duration_conversions/toString_duration_max
      - timestamps/duration_conversions/toString_duration_min
      - timestamps/timestamp_arithmetic/add_duration_to_duration_max
      - timestamps/timestamp_arithmetic/add_max_duration_to_min_time
      - timestamps/timestamp_arithmetic/subtract_duration_from_duration_min
      - timestamps/timestamp_arithmetic/subtract_max_duration_from_max_time
      - timestamps/timestamp_range/sub_time_duration_over
      - timestamps/timestamp_range/sub_time_duration_under
      - wrappers/duration/max_value
      - wrappers/duration/min_value
      - wrappers/duration/nanos_over
      - wrappers/duration/nanos_under
      - wrappers/duration/negative_seconds_positive_nanos
      - wrappers/duration/positive_seconds_negative_nanos
      - wrappers/duration/seconds_over
      - wrappers/duration/seconds_under
      - wrappers/timestamp/nanos_over
      - wrappers/timestamp/nanos_under
      - wrappers/timestamp/negative_seconds_negative_nanos
      - wrappers/timestamp/seconds_over
      - wrappers/timestamp/seconds_under
      - string_ext/value_errors/indexof_out_of_range,lastindexof_out_of_range
  # https://github.com/cel-expr/cel-cpp/blob/v0.16.1/conformance/BUILD
  # Target `conformance_checked` (modern = True, `_TESTS_TO_SKIP_MODERN`).
  # cel-spec pinned to BCR 0.25.1 in MODULE.bazel.
  - id: cpp_modern
    runtime: cpp
    config: modern
    label: "C++ (Modern)"
    build_file: "third_party/cel/cpp/conformance/BUILD"
    build_skip_var: "_TESTS_TO_SKIP_MODERN"
    build_tests_var: "_ALL_TESTS"
    runtime_version: "v0.16.1"
    spec_commit: "HEAD (pinned: 0.25.1)"
    absent_suites:
      - lists_ext.textproto
      - network_ext.textproto
    absent_sections:
      - namespace/namespace_shadowing
      - string_ext/reverse
    # Omitted from configured_skips:
    #   enums/legacy_proto2/select_big,select_neg (no matching tests in
    #     enums.textproto)
    #   namespace/namespace_shadowing/basic and
    #     namespace/namespace_shadowing/comprehension_shadowing_namespaced_selector_disambiguation
