# Expected-matrix manifest declaring the required (runtime, config) columns
# and their baseline disabled suites and configured skips.
#
# Each column mirrors the conformance configuration checked in at the latest
# GitHub release tag of that runtime:
#   runtime_version:         Release tag of the runtime.
#   spec_commit:             cel-spec revision rendered in the Spec Commit row.
#                            Counts are computed against each runtime's pinned
#                            cel-spec revision by excluding post-pin suites,
#                            sections, and tests via absent_*.
#   disabled_suites:         Testdata files present at the pin but not listed in
#                            the runtime's `_ALL_TESTS` (rendered as ⬜).
#                            Auto-appended during BUILD sync unless listed in
#                            `ignored_disabled_suites` or `absent_suites`.
#   ignored_disabled_suites: Testdata files omitted from a local workspace's
#                            older `build_tests_var` import that are already
#                            enabled at the pinned runtime release.
#   absent_suites:           Testdata files that do not exist at the pinned
#                            cel-spec revision (rendered as `n/a`).
#   absent_sections:         "<suite>/<section>" keys that do not exist at the
#                            pinned cel-spec revision (rendered as `n/a`).
#   absent_tests:            "<suite>/<section>/<test>" keys added after the
#                            pinned cel-spec revision (excluded from section
#                            totals so counts reflect the pin accurately).
#   ignored_build_skips:     Skips present in a local workspace's older
#                            `build_skip_var` import that were fixed or removed
#                            by `runtime_version`.
#   configured_skips:        The runtime's skip list at the release tag.
#                            Auto-appended during BUILD sync unless covered by
#                            `ignored_build_skips` or `absent_*` / `disabled_*`.
#
# Sections and individual tests present in testdata .textproto files that have
# been removed or deprecated from the CEL specification and are excluded from
# the matrix across all columns:
excluded_sections:
  - enums/strong_proto2
  - enums/strong_proto3
excluded_tests:
  - basic/functions/unbound_is_runtime_error

columns:
  # https://github.com/cel-expr/cel-go/blob/v0.33.2/conformance/BUILD.bazel
  # cel-spec pinned to ba58ae5 (v0.25.3) in MODULE.bazel.
  - id: go
    runtime: go
    config: default
    label: "Go"
    build_file: "cel-go/conformance/BUILD.bazel"
    build_skip_var: "_TESTS_TO_SKIP"
    build_tests_var: "_ALL_TESTS"
    # Suites omitted from the workspace's older cel-go import that are enabled
    # by v0.33.2:
    ignored_disabled_suites:
      - block_ext.textproto
      - lists_ext.textproto
      - macros2.textproto
      - type_deduction.textproto
    # Skips present in the workspace's older cel-go import that were fixed
    # by v0.33.2:
    ignored_build_skips:
      - macros/exists/list_elem_type_exhaustive,map_key_type_exhaustive
      - macros/map/map_extract_keys
      - timestamps/timestamp_range/sub_time_duration_over
      - timestamps/timestamp_range/sub_time_duration_under
      - string_ext/format
    runtime_version: "v0.33.2"
    spec_commit: "HEAD (pinned: ba58ae5)"
    # AUTO-APPENDED by `generate_conformance_matrix` when synced against
    # runtime BUILD files. Do not add entries by hand; remove entries manually
