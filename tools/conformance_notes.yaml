# Human-authored notes, regression allowlists, and callout blocks for
# non-conforming suites and skipped sections in the CEL Conformance Coverage
# Matrix.
# Every section that resolves to ⚠️ (Skipped) in any runtime column MUST have
# a matching entry here (either "<suite>/<section>" or "<suite>/*") when
# validating live reports; synthesized runs can also emit fallback notes for
# undocumented skips, though curated entries here are preferred for clarity.
#
# Entries under `notes` may provide a row-level `note`, per-column notes under
# `columns` (keyed by column id, "<runtime>/<config>", or "<runtime>"), and/or
# `allow_regression` (list of column ids, "<runtime>/<config>", "<runtime>",
# or "*"). Column notes are only rendered when that column's cell is not ✅.
#
# Entries under `callouts` support keys: `title` (required), `runtimes`,
# `tracking`, and `details`. Only public GitHub issue links may be referenced
# in this file.
notes:
  block_ext/basic:
    columns:
      cpp_legacy: "C++ Legacy skips `optional_*` tests (no `optional_type` support)"
  conversions/string:
    columns:
      cpp: "C++ skips `double_hard` (shortest-precision double formatting)"
  fields/qualified_identifier_resolution:
    columns:
      go: "Go skips `map_key_float`, `map_key_null`, `map_value_repeat_key`, `map_value_repeat_key_heterogeneous`"
      cpp: "C++ skips `qualified_identifier_resolution_unchecked` (parsed-only container-qualified lookup; supported for checked expressions where the checker rewrites the identifier; [cel-cpp#97](https://github.com/cel-expr/cel-cpp/issues/97)) and `map_value_repeat_key_heterogeneous`"
  lists_ext/*:
    columns:
      cpp_legacy: "C++ Legacy does not implement `lists_ext`"
  namespace/namespace:
    columns:
      cpp: "C++ skips `self_eval_container_lookup_unchecked` ([cel-cpp#97](https://github.com/cel-expr/cel-cpp/issues/97))"
  network_ext/*:
    columns:
      go: "Not listed in Go `_ALL_TESTS`"
      cpp: "Not listed in C++ `_ALL_TESTS`"
      java: "Not listed in Java `_ALL_TESTS`"
  optionals/optionals:
    columns:
      go: "Go skips `map_optional_select_has`"
      cpp_legacy: "C++ Legacy does not support `optional_type`"
  proto2/set_null:
    columns:
      cpp_legacy: "C++ Legacy skips `list_value` and `single_struct` null assignment"
  proto3/set_null:
    columns:
      cpp_legacy: "C++ Legacy skips `list_value` and `single_struct` null assignment"
  sets_ext/*:
    columns:
      go: "Suite not in the `cel-spec` release pinned by Go"
      java: "Suite not in the `cel-spec` release pinned by Java"
  string_ext/value_errors:
    columns:
      go: "Go skips `indexof_out_of_range` and `lastindexof_out_of_range` pending a spec update"
  timestamps/duration_converters:
    note: "`get_milliseconds` skipped pending `Duration.getMilliseconds` deprecation ([cel-cpp#93](https://github.com/cel-expr/cel-cpp/issues/93))"
  timestamps/timestamp_range:
    columns:
      cpp: "C++ skips `sub_time_duration_over` and `sub_time_duration_under`"
  timestamps/timestamp_selectors_tz:
    columns:
      cpp: "C++ skips tests that depend on legacy `US/` time zones"
  type_deductions/empty_range_nested_comprehensions:
    columns:
      go: "Section not in the `cel-spec` release pinned by Go"
      java: "Section not in the `cel-spec` release pinned by Java"
  type_deductions/legacy_nullable_types:
    columns:
      go: "Go skips null-assignability parameter candidate tests"
      java: "Java skips null-assignability parameter candidate tests"
  type_deductions/type_decay:
    columns:
      go: "Section not in the `cel-spec` release pinned by Go"
      cpp: "C++ skips `type_list_decay`, `type_ternary_decay`, `type_nested_list_decay`, `type_free_param_list_concat`"
      java: "Section not in the `cel-spec` release pinned by Java"
  type_deductions/type_parameters_in_type_type:
    columns:
      go: "Section not in the `cel-spec` release pinned by Go"
      java: "Section not in the `cel-spec` release pinned by Java"
  type_deductions/wrappers:
    columns:
      go: "Go skips `wrapper_promotion_2`"
      java: "Java skips `wrapper_promotion`"

callouts:
  - title: "`network_ext` (Not Enabled)"
    runtimes: "Go (`⬜`), C++ Modern & Legacy (`⬜`), Java (`⬜`)"
    details: "`network_ext.textproto` defines IP/CIDR network extension tests and is present at each runtime's pinned `cel-spec` release, but is not listed in `_ALL_TESTS` for Go, C++, or Java."
  - title: "`lists_ext`, `optionals/optionals`, & `block_ext/basic` optional tests (Skipped in C++ Legacy)"
    runtimes: "C++ Legacy (`⚠️`)"
    details: "The legacy C++ evaluator does not implement `lists_ext` or `optional_type`, so `lists_ext/*`, `optionals/optionals`, and the `optional_list`, `optional_map`, `optional_map_chained`, and `optional_message` tests in `block_ext/basic` are skipped."
  - title: "`timestamps/duration_converters` (`getMilliseconds`)"
    runtimes: "Go, C++ (Modern & Legacy)"
    tracking: "[cel-cpp#93](https://github.com/cel-expr/cel-cpp/issues/93) (closed)"
    details: "`timestamps/duration_converters/get_milliseconds` is skipped pending deprecation of `Duration.getMilliseconds` in the spec."
  - title: "`fields/qualified_identifier_resolution` & `namespace`"
    runtimes: "Go, C++ (Modern & Legacy)"
    tracking: "[cel-cpp#97](https://github.com/cel-expr/cel-cpp/issues/97)"
    details: "C++ does not support qualified identifier lookups within containers for parsed-only expressions, though checked expressions pass because the type checker rewrites the identifier (`qualified_identifier_resolution_unchecked` and `namespace/namespace/self_eval_container_lookup_unchecked` force parse-only evaluation); C++ also skips `map_value_repeat_key_heterogeneous`. Go skips `map_key_float`, `map_key_null`, `map_value_repeat_key`, and `map_value_repeat_key_heterogeneous`."
